<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Science & Statistics Study Guide</title>
</head>
<body>

<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Mono:wght@400;500&family=Outfit:wght@400;500;600&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f8f7f4;--card:#fff;--border:#e8e4dc;
  --text:#1a1814;--muted:#6b6560;--accent:#2563eb;
  --accent-soft:#eff6ff;--tag:#fef3c7;--tag-t:#92400e;
  --formula-bg:#f0fdf4;--formula-b:#16a34a;
  --warn-bg:#fff7ed;--warn-b:#ea580c;
  --nav-w:220px;
}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text);display:flex;min-height:100vh}
.sidebar{width:var(--nav-w);background:var(--card);border-right:1px solid var(--border);position:sticky;top:0;height:100vh;overflow-y:auto;padding:1rem 0;flex-shrink:0}
.sidebar-title{font-family:'DM Serif Display',serif;font-size:15px;padding:0 1rem 0.75rem;color:var(--muted);border-bottom:1px solid var(--border);margin-bottom:0.5rem}
.nav-item{display:flex;align-items:center;gap:8px;padding:8px 1rem;cursor:pointer;font-size:13px;color:var(--muted);border-left:2px solid transparent;transition:all .15s}
.nav-item:hover{background:#f5f3f0;color:var(--text)}
.nav-item.active{background:var(--accent-soft);color:var(--accent);border-left:2px solid var(--accent);font-weight:500}
.nav-icon{font-size:14px;width:18px;text-align:center}
.main{flex:1;overflow-y:auto;padding:2rem;max-width:860px}
.topic{display:none}
.topic.active{display:block}
.topic-header{margin-bottom:2rem}
.topic-tag{display:inline-block;background:var(--tag);color:var(--tag-t);font-size:11px;font-weight:500;padding:3px 10px;border-radius:20px;margin-bottom:0.75rem;font-family:'DM Mono',monospace;letter-spacing:0.5px}
.topic-title{font-family:'DM Serif Display',serif;font-size:32px;line-height:1.2;margin-bottom:0.5rem}
.topic-desc{color:var(--muted);font-size:15px;line-height:1.6}
.section{margin-bottom:2rem}
.section-label{font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:0.75rem;display:flex;align-items:center;gap:8px}
.section-label::after{content:'';flex:1;height:1px;background:var(--border)}
h3{font-size:16px;font-weight:500;margin-bottom:0.5rem;color:var(--text)}
p{font-size:14px;line-height:1.7;color:#3d3a36;margin-bottom:0.75rem}
.analogy-box{background:linear-gradient(135deg,#fefce8,#fef9c3);border:1px solid #fde68a;border-radius:10px;padding:1rem 1.25rem;margin-bottom:1rem}
.analogy-box .label{font-size:11px;font-weight:600;color:#92400e;letter-spacing:.5px;margin-bottom:0.4rem}
.formula-box{background:var(--formula-bg);border:1px solid var(--formula-b);border-radius:10px;padding:1rem 1.25rem;margin:1rem 0;font-family:'DM Mono',monospace}
.formula-box .f-title{font-size:11px;font-weight:500;color:var(--formula-b);margin-bottom:0.5rem;letter-spacing:.3px}
.formula-main{font-size:16px;font-weight:500;color:#166534;margin-bottom:0.5rem}
.formula-vars{font-size:12px;color:var(--muted);line-height:1.8}
.concept-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:1rem}
.concept-card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:0.875rem}
.concept-card h4{font-size:13px;font-weight:500;margin-bottom:0.3rem;color:var(--accent)}
.concept-card p{font-size:12px;color:var(--muted);margin:0;line-height:1.5}
.example-box{background:#fafaf9;border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding:1rem 1.25rem;margin:1rem 0}
.example-box .ex-title{font-size:12px;font-weight:600;color:var(--accent);margin-bottom:0.5rem;letter-spacing:.3px}
.step{display:flex;gap:10px;margin-bottom:0.5rem;font-size:13px;align-items:flex-start}
.step-num{background:var(--accent);color:#fff;border-radius:50%;width:20px;height:20px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0;margin-top:1px}
.step-text{color:#3d3a36;line-height:1.6}
.warn-box{background:var(--warn-bg);border:1px solid #fdba74;border-radius:8px;padding:0.875rem 1rem;margin:1rem 0}
.warn-box .w-label{font-size:11px;font-weight:600;color:var(--warn-b);margin-bottom:0.3rem;letter-spacing:.3px}
.warn-box p{font-size:13px;color:#7c2d12;margin:0;line-height:1.5}
.qa-item{border:1px solid var(--border);border-radius:8px;margin-bottom:0.75rem;overflow:hidden}
.qa-q{padding:0.75rem 1rem;font-size:13px;font-weight:500;cursor:pointer;display:flex;justify-content:space-between;align-items:center;background:var(--card)}
.qa-q:hover{background:#f5f3f0}
.qa-a{display:none;padding:0.75rem 1rem;font-size:13px;color:var(--muted);border-top:1px solid var(--border);line-height:1.6;background:#fafaf9}
.qa-a.open{display:block}
.difficulty{font-size:10px;padding:2px 7px;border-radius:10px;font-weight:500}
.easy{background:#dcfce7;color:#166534}
.medium{background:#fef9c3;color:#92400e}
.hard{background:#fee2e2;color:#991b1b}
.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sum-card{background:var(--accent-soft);border:1px solid #bfdbfe;border-radius:8px;padding:0.875rem}
.sum-card h4{font-size:12px;font-weight:600;color:var(--accent);margin-bottom:0.4rem;letter-spacing:.3px}
.sum-card p{font-size:12px;color:#1e40af;margin:0;line-height:1.6;font-family:'DM Mono',monospace}
.app-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:0.5rem}
.chip{background:#f0fdf4;border:1px solid #86efac;border-radius:20px;padding:3px 10px;font-size:12px;color:#166534}
.progress-bar{background:#e5e7eb;border-radius:4px;height:4px;margin-bottom:2rem;overflow:hidden}
.progress-fill{height:100%;background:var(--accent);transition:width .3s;border-radius:4px}
table{width:100%;border-collapse:collapse;font-size:13px;margin:0.75rem 0}
th{background:#f5f3f0;padding:8px 10px;text-align:left;font-weight:500;font-size:12px;border:1px solid var(--border)}
td{padding:8px 10px;border:1px solid var(--border);color:#3d3a36}
tr:nth-child(even) td{background:#fafaf9}
.highlight{background:#fef08a;padding:1px 3px;border-radius:3px}
</style>

<div style="display:flex;min-height:600px">
<div class="sidebar">
  <div class="sidebar-title">Data Science Stats</div>
  <div id="nav"></div>
</div>
<div class="main" id="main">
  <div class="progress-bar"><div class="progress-fill" id="prog" style="width:11%"></div></div>
  <div id="topics"></div>
</div>
</div>

<script>
const topics=[
{id:'prob',icon:'🎲',label:'Probability Basics',tag:'FOUNDATION',title:'Probability & Statistics',desc:'The mathematical language of uncertainty — the backbone of every ML model, A/B test, and data-driven decision.',sections:[{type:'overview',content:`<h3>What is Probability?</h3><p>Probability measures <strong>how likely</strong> an event is to occur, on a scale from 0 (impossible) to 1 (certain). Statistics is the science of collecting, analyzing, and interpreting data.</p><p>In data science: Probability helps you understand uncertainty in predictions. Statistics helps you validate hypotheses.</p>`},{type:'intuition',content:`<div class="analogy-box"><div class="label">REAL-LIFE ANALOGY</div><p style="margin:0;font-size:13px;color:#78350f">Imagine you have a bag with 3 red balls and 7 blue balls. If you draw one ball randomly, the probability of getting red is 3/10 = 0.3. Now imagine predicting which email is spam — probability works the same way!</p></div>`},{type:'concepts',content:`<div class="concept-grid"><div class="concept-card"><h4>Sample Space (S)</h4><p>All possible outcomes. Tossing a coin: S = {H, T}. Rolling a die: S = {1,2,3,4,5,6}</p></div><div class="concept-card"><h4>Event (E)</h4><p>A subset of the sample space. Rolling an even number: E = {2,4,6}</p></div><div class="concept-card"><h4>Complement (Eᶜ)</h4><p>Everything NOT in E. If E = rain, Eᶜ = no rain. P(Eᶜ) = 1 − P(E)</p></div><div class="concept-card"><h4>Conditional Probability</h4><p>Probability of A given B already happened: P(A|B). Updates your belief with new information.</p></div></div>`},{type:'formulas',content:`<div class="formula-box"><div class="f-title">BASIC PROBABILITY</div><div class="formula-main">P(E) = Number of favorable outcomes / Total outcomes</div><div class="formula-vars">P ranges from 0 to 1 | Sum of all probabilities = 1</div></div><div class="formula-box"><div class="f-title">ADDITION RULE</div><div class="formula-main">P(A ∪ B) = P(A) + P(B) − P(A ∩ B)</div><div class="formula-vars">∪ = union (A or B) | ∩ = intersection (both)</div></div><div class="formula-box"><div class="f-title">CONDITIONAL PROBABILITY</div><div class="formula-main">P(A|B) = P(A ∩ B) / P(B)</div><div class="formula-vars">P(A|B) = probability of A given B occurred | B must have P(B) > 0</div></div><div class="formula-box"><div class="f-title">MULTIPLICATION RULE</div><div class="formula-main">P(A ∩ B) = P(A) × P(B)</div><div class="formula-vars">Valid only when A and B are independent</div></div>`},{type:'example',content:`<div class="example-box"><div class="ex-title">WORKED EXAMPLE — Card Draw</div><div class="step"><div class="step-num">1</div><div class="step-text">A standard deck has 52 cards. P(Ace)?</div></div><div class="step"><div class="step-num">2</div><div class="step-text">Favorable: 4 aces | Total: 52</div></div><div class="step"><div class="step-num">3</div><div class="step-text">P(Ace) = 4/52 = 1/13 ≈ 0.077 or 7.7%</div></div><div class="step"><div class="step-num">4</div><div class="step-text">P(NOT Ace) = 1 − 1/13 = 12/13 ≈ 92.3%</div></div></div>`},{type:'mistakes',content:`<div class="warn-box"><div class="w-label">MISTAKE 1</div><p>Confusing P(A|B) with P(B|A). These are inverse conditionals and very different.</p></div><div class="warn-box"><div class="w-label">MISTAKE 2</div><p>Assuming independence. If you draw a card without replacing it, probabilities change.</p></div>`},{type:'practice',qa:[{q:'A bag has 5 red, 3 green, 2 blue balls. What is P(red)?',d:'easy',a:'P(red) = 5/10 = 0.5 or 50%'},{q:'P(rolling a 3 OR 5) on a fair die?',d:'easy',a:'P(3) + P(5) = 1/6 + 1/6 = 1/3 ≈ 33.3%'},{q:'In a class of 40, 25 play cricket, 15 play football, 5 play both. P(cricket or football)?',d:'medium',a:'P(C∪F) = 25/40 + 15/40 − 5/40 = 35/40 = 0.875 or 87.5%'}]},{type:'summary',content:`<div class="summary-grid"><div class="sum-card"><h4>KEY FORMULA</h4><p>P(E) = favourable / total<br>P(A|B) = P(A∩B) / P(B)<br>P(Eᶜ) = 1 − P(E)</p></div><div class="sum-card"><h4>KEY INSIGHT</h4><p>Probability lives 0 to 1. All probabilities sum to 1. Conditional prob updates belief.</p></div></div>`}]},
{id:'bayes',icon:'🔄',label:'Bayes Theorem',tag:'CORE CONCEPT',title:"Bayes' Theorem",desc:"Update beliefs as new evidence arrives. Used in spam filters, medical diagnosis, AI.",sections:[{type:'overview',content:`<h3>Bayes' Theorem</h3><p>Updates your belief when you receive new evidence. Connects prior knowledge with likelihood to produce posterior belief.</p>`},{type:'intuition',content:`<div class="analogy-box"><div class="label">MEDICAL TEST ANALOGY</div><p style="margin:0;font-size:13px;color:#78350f">Disease affects 1% of population. Test is 95% accurate. If positive, do you have it? Not necessarily! Account for rarity.</p></div>`},{type:'formulas',content:`<div class="formula-box"><div class="f-title">BAYES' THEOREM</div><div class="formula-main">P(A|B) = [ P(B|A) × P(A) ] / P(B)</div><div class="formula-vars">Prior P(A) | Likelihood P(B|A) | Posterior P(A|B)</div></div><div class="formula-box"><div class="f-title">LAW OF TOTAL PROBABILITY</div><div class="formula-main">P(B) = P(B|A)×P(A) + P(B|Aᶜ)×P(Aᶜ)</div><div class="formula-vars">Sum over all ways B can occur</div></div>`},{type:'example',content:`<div class="example-box"><div class="ex-title">Disease Diagnosis</div><div class="step"><div class="step-num">1</div><div class="step-text">Prevalence: P(Disease) = 0.01</div></div><div class="step"><div class="step-num">2</div><div class="step-text">Sensitivity: P(Positive|Disease) = 0.95</div></div><div class="step"><div class="step-num">3</div><div class="step-text">False positive: P(Positive|No Disease) = 0.05</div></div><div class="step"><div class="step-num">4</div><div class="step-text">P(Positive) = 0.95×0.01 + 0.05×0.99 = 0.059</div></div><div class="step"><div class="step-num">5</div><div class="step-text">P(Disease|Positive) = 0.0095 / 0.059 = <span class="highlight">16.1%</span></div></div></div>`},{type:'applications',content:`<p>Applications:</p><div class="app-chips"><span class="chip">Spam filtering</span><span class="chip">Medical diagnosis</span><span class="chip">Fraud detection</span></div>`},{type:'mistakes',content:`<div class="warn-box"><div class="w-label">BASE RATE NEGLECT</div><p>Ignoring prior P(A) is the #1 mistake. Always ask: how common is this event?</p></div>`},{type:'practice',qa:[{q:'Email is 30% spam. "FREE" in 80% spam, 10% non-spam. Email has "FREE". P(spam)?',d:'hard',a:'P(spam|FREE) = (0.8×0.3)/0.31 ≈ 77.4%'},{q:'3 components of Bayes?',d:'easy',a:'Prior, Likelihood, Posterior'}]},{type:'summary',content:`<div class="summary-grid"><div class="sum-card"><h4>KEY FORMULA</h4><p>P(A|B) = P(B|A)×P(A) / P(B)</p></div><div class="sum-card"><h4>KEY INSIGHT</h4><p>Always consider base rate. Evidence updates, not replaces beliefs.</p></div></div>`}]},
{id:'discrete',icon:'📊',label:'Discrete Distributions',tag:'PROBABILITY',title:'Discrete Distributions',desc:'Models for counting outcomes. Foundation of classification.',sections:[{type:'overview',content:`<h3>Discrete Distributions</h3><p>Describes probability of each outcome of discrete random variables (countable values like 0,1,2...).</p>`},{type:'intuition',content:`<div class="analogy-box"><div class="label">ANALOGY</div><p style="margin:0;font-size:13px;color:#78350f">Flip 10 coins, count heads. You get 0,1,2...10. Each has probability. That's discrete!</p></div>`},{type:'formulas',content:`<h3>Bernoulli</h3><div class="formula-box"><div class="f-title">PMF</div><div class="formula-main">P(X=k) = p^k × (1−p)^(1−k)</div><div class="formula-vars">Mean = p, Variance = p(1-p)</div></div><h3>Binomial</h3><div class="formula-box"><div class="f-title">PMF</div><div class="formula-main">P(X=k) = C(n,k) × p^k × (1−p)^(n−k)</div><div class="formula-vars">n trials, k successes, Mean = np</div></div><h3>Poisson</h3><div class="formula-box"><div class="f-title">PMF</div><div class="formula-main">P(X=k) = (λ^k × e^(−λ)) / k!</div><div class="formula-vars">Mean = Variance = λ</div></div>`},{type:'example',content:`<div class="example-box"><div class="ex-title">Binomial</div><div class="step"><div class="step-num">1</div><div class="step-text">Factory: 10% defect. Sample 5. P(exactly 2 defective)?</div></div><div class="step"><div class="step-num">2</div><div class="step-text">C(5,2) = 10</div></div><div class="step"><div class="step-num">3</div><div class="step-text">P(X=2) = 10 × 0.01 × 0.729 = <span class="highlight">7.3%</span></div></div></div>`},{type:'practice',qa:[{q:'Coin flipped 6 times. P(exactly 4 heads)?',d:'medium',a:'C(6,4) × 0.5^6 = 15/64 ≈ 23.4%'},{q:'When use Poisson over Binomial?',d:'easy',a:'When n large, p small. n≥20, p≤0.05'},{q:'Website: 5 crashes/hour. P(0 crashes)?',d:'medium',a:'e^-5 ≈ 0.67%'}]},{type:'summary',content:`<div class="summary-grid"><div class="sum-card"><h4>FORMULAS</h4><p>Bernoulli: p^k(1-p)^(1-k)<br>Binomial: C(n,k)p^k(1-p)^(n-k)<br>Poisson: λ^k·e^-λ / k!</p></div></div>`}]},
{id:'sampling',icon:'🎯',label:'Sampling',tag:'STATISTICS',title:'Sampling Techniques',desc:'How to collect representative data.',sections:[{type:'overview',content:`<h3>Sampling</h3><p>Study a subset to draw conclusions about the entire population.</p>`},{type:'concepts',content:`<div class="concept-grid"><div class="concept-card"><h4>Simple Random</h4><p>Equal chance for all members.</p></div><div class="concept-card"><h4>Stratified</h4><p>Divide into groups, sample from each.</p></div><div class="concept-card"><h4>Systematic</h4><p>Every k-th element.</p></div><div class="concept-card"><h4>Cluster</h4><p>Select entire clusters randomly.</p></div></div>`},{type:'formulas',content:`<div class="formula-box"><div class="f-title">STANDARD ERROR</div><div class="formula-main">SE = σ / √n</div></div><div class="formula-box"><div class="f-title">CONFIDENCE INTERVAL (95%)</div><div class="formula-main">CI = x̄ ± 1.96 × (σ/√n)</div></div>`},{type:'practice',qa:[{q:'SE if σ=15, n=100?',d:'easy',a:'SE = 15/10 = 1.5'},{q:'Best method for age groups survey?',d:'medium',a:'Stratified sampling'}]},{type:'summary',content:`<div class="summary-grid"><div class="sum-card"><h4>KEY FORMULA</h4><p>SE = σ/√n</p></div><div class="sum-card"><h4>KEY INSIGHT</h4><p>Larger n reduces variance, not bias.</p></div></div>`}]},
{id:'hypo',icon:'⚖️',label:'Hypothesis Testing',tag:'INFERENCE',title:'Hypothesis Testing',desc:'Rigorous framework to test claims using data.',sections:[{type:'overview',content:`<h3>Hypothesis Testing</h3><p>Formal procedure to evaluate population claims based on sample data.</p>`},{type:'concepts',content:`<div class="concept-grid"><div class="concept-card"><h4>H₀ — Null</h4><p>Default assumption: no effect.</p></div><div class="concept-card"><h4>H₁ — Alternative</h4><p>What you're trying to prove.</p></div><div class="concept-card"><h4>p-value</h4><p>Probability of extreme results under H₀.</p></div><div class="concept-card"><h4>α Level</h4><p>Threshold (typically 0.05).</p></div></div>`},{type:'formulas',content:`<div class="formula-box"><div class="f-title">Z-TEST</div><div class="formula-main">z = (x̄ − μ₀) / (σ/√n)</div></div><div class="formula-box"><div class="f-title">T-TEST</div><div class="formula-main">t = (x̄ − μ₀) / (s/√n)</div></div>`},{type:'practice',qa:[{q:'p=0.03, α=0.05. Conclude?',d:'easy',a:'Reject H₀'},{q:'What is power?',d:'medium',a:'1−β = prob of correctly rejecting H₀ when H₁ true'}]},{type:'summary',content:`<div class="summary-grid"><div class="sum-card"><h4>KEY INSIGHT</h4><p>Significance ≠ practicality. Always check effect size.</p></div></div>`}]},
{id:'ab',icon:'🔬',label:'A/B Testing',tag:'APPLIED',title:'A/B Testing',desc:'Gold standard of data-driven decisions.',sections:[{type:'overview',content:`<h3>A/B Testing</h3><p>Controlled experiment: compare Control (A) vs Treatment (B).</p>`},{type:'concepts',content:`<div class="concept-grid"><div class="concept-card"><h4>Control (A)</h4><p>Original version, baseline.</p></div><div class="concept-card"><h4>Treatment (B)</h4><p>New version, one change.</p></div><div class="concept-card"><h4>Metric</h4><p>Define KPI before test.</p></div></div>`},{type:'example',content:`<div class="example-box"><div class="ex-title">Button Color Test</div><div class="step"><div class="step-num">1</div><div class="step-text">Blue button: 5% conversion</div></div><div class="step"><div class="step-num">2</div><div class="step-text">Orange button: 6.36%</div></div><div class="step"><div class="step-num">3</div><div class="step-text">p < 0.05. Ship orange!</div></div></div>`},{type:'mistakes',content:`<div class="warn-box"><div class="w-label">PEEKING</div><p>Stopping early inflates errors. Run full duration.</p></div><div class="warn-box"><div class="w-label">NOVELTY</div><p>New UI gets temporary boost. Run 2+ weeks.</p></div>`},{type:'practice',qa:[{q:'Min test duration?',d:'easy',a:'2 weeks minimum for day-of-week effects'},{q:'Stop after 3 days with p=0.04?',d:'medium',a:'No, run full planned duration'}]},{type:'summary',content:`<div class="summary-grid"><div class="sum-card"><h4>PROCESS</h4><p>1. Define metric<br>2. Calculate n<br>3. Random assign<br>4. Run full duration<br>5. Analyze</p></div></div>`}]},
{id:'guesstimate',icon:'🧮',label:'Guesstimate',tag:'INTERVIEW',title:'Guesstimate Problems',desc:'Estimation under uncertainty.',sections:[{type:'overview',content:`<h3>Guesstimates</h3><p>Reasoned estimates using logical assumptions and back-of-envelope math.</p>`},{type:'concepts',content:`<h3>MECE Framework</h3><div class="concept-grid"><div class="concept-card"><h4>Step 1: Clarify</h4><p>Define precisely: geography, time period, context.</p></div><div class="concept-card"><h4>Step 2: Break Down</h4><p>Decompose into components.</p></div><div class="concept-card"><h4>Step 3: Estimate</h4><p>Estimate each component.</p></div><div class="concept-card"><h4>Step 4: Sanity Check</h4><p>Does it feel right?</p></div></div>`},{type:'example',content:`<div class="example-box"><div class="ex-title">Piano Tuners in Mumbai</div><div class="step"><div class="step-num">1</div><div class="step-text">Population: 20M</div></div><div class="step"><div class="step-num">2</div><div class="step-text">Households: 5M</div></div><div class="step"><div class="step-num">3</div><div class="step-text">With pianos: ~25,000</div></div><div class="step"><div class="step-num">4</div><div class="step-text">Tuners: 25,000 / 1,000 per year = <span class="highlight">~25</span></div></div></div>`},{type:'practice',qa:[{q:'WhatsApp messages/day in India?',d:'hard',a:'350M active × 30 msgs = ~10.5B/day'},{q:'Revenue: 5M MAU, 3% conversion, ₹1500 AOV?',d:'medium',a:'150K × 1500 = ₹225 crores/month'}]},{type:'summary',content:`<div class="summary-grid"><div class="sum-card"><h4>ANCHORS</h4><p>India: 1.4B | Mumbai: 20M<br>Delhi: 32M | Bengaluru: 12M</p></div></div>`}]}
];

function renderNav(){
  const nav=document.getElementById('nav');
  topics.forEach((t,i)=>{
    const d=document.createElement('div');
    d.className='nav-item'+(i===0?' active':'');
    d.innerHTML=`<span class="nav-icon">${t.icon}</span>${t.label}`;
    d.onclick=()=>switchTopic(i);
    nav.appendChild(d);
  });
}

function renderSections(t){
  let html=`<div class="topic-header"><div class="topic-tag">${t.tag}</div><div class="topic-title">${t.title}</div><p class="topic-desc">${t.desc}</p></div>`;
  const labels={overview:'Overview',intuition:'Intuition',concepts:'Concepts',formulas:'Formulas',example:'Examples',applications:'Applications',mistakes:'Common Mistakes',practice:'Practice'};
  t.sections.forEach(s=>{
    html+=`<div class="section"><div class="section-label">${labels[s.type]||s.type}</div>`;
    if(s.type==='practice'){
      s.qa.forEach((q)=>{
        html+=`<div class="qa-item"><div class="qa-q" onclick="toggleQ(this)"><span><span class="difficulty ${q.d}">${q.d}</span> ${q.q}</span><span>+</span></div><div class="qa-a">Answer: ${q.a}</div></div>`;
      });
    } else {
      html+=s.content;
    }
    html+=`</div>`;
  });
  return html;
}

function renderTopics(){
  const cont=document.getElementById('topics');
  topics.forEach((t,i)=>{
    const d=document.createElement('div');
    d.className='topic'+(i===0?' active':'');
    d.id='t'+i;
    d.innerHTML=renderSections(t);
    cont.appendChild(d);
  });
}

function switchTopic(idx){
  document.querySelectorAll('.topic').forEach((t,i)=>t.classList.toggle('active',i===idx));
  document.querySelectorAll('.nav-item').forEach((n,i)=>n.classList.toggle('active',i===idx));
  document.getElementById('prog').style.width=Math.round((idx+1)/topics.length*100)+'%';
  document.getElementById('main').scrollTop=0;
}

function toggleQ(el){
  const a=el.nextElementSibling;
  a.classList.toggle('open');
  el.querySelector('span:last-child').textContent=a.classList.contains('open')?'−':'+';
}

renderNav();
renderTopics();
</script>
